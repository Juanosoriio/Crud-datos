<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-code-square"></i> CRUD Datos
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="bi bi-table"></i> CRUD Principal
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="callbacks/callbacks.html">
                            <i class="bi bi-arrow-repeat"></i> Callbacks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="promises/promises.html">
                            <i class="bi bi-hourglass-split"></i> Promises
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="async-await/async-await.html">
                            <i class="bi bi-lightning-charge"></i> Async/Await
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destructuring/destructuring.html">
                            <i class="bi bi-box-arrow-in-down"></i> Destructuring
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sección CRUD Principal -->
    <div class="seccion-contenido">
        <div class="header">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1>CRUD Datos</h1>
                        <p>Feature-Based + Bootstrap 5 + localStorage</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <button class="btn btn-export" onclick="exportarJSON()">
                            <i class="bi bi-download"></i> Exportar JSON
                        </button>
                        <button class="btn btn-delete-all" onclick="borrarTodo()">
                            <i class="bi bi-trash"></i> Borrar todo
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="registro-section">
                        <h3>Registro de Datos</h3>
                        <p>Registra o actualiza los datos.</p>
                        
                        <form id="formDatos" onsubmit="guardarDatos(event)">
                            <div class="mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" placeholder="Ej: Juan Carlos Ramírez Lozada" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="documento" class="form-label">Documento</label>
                                <input type="text" class="form-control" id="documento" placeholder="Ej: 10203040" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Ej: juan@email.com" required>
                            </div>
                            
                            <input type="hidden" id="editIndex" value="-1">

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-guardar">
                                    <i class="bi bi-save"></i> Guardar
                                </button>
                                <button type="button" class="btn-limpiar" onclick="limpiarFormulario()">
                                    <i class="bi bi-x-circle"></i> Limpiar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="col-lg-8">
                    <div class="table-container">
                        <table class="table" id="tablaDatos">
                            <thead>
                                <tr>
                                    <th>Correo</th>
                                    <th>Nombre Completo</th>
                                    <th>Documento</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpo">
                                <tr>
                                    <td colspan="4" class="empty-state">
                                        No hay datos registrados
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>Copyright © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
